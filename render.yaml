services:
  - type: web
    name: qoneqt-content-studio
    env: docker
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: VOICE_ENABLED
        value: "true"
      - key: IMAGE_GENERATION_ENABLED
        value: "true"
